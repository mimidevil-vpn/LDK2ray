<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>mimi crack v3</title>
<style>
@font-face{font-family:'MinecraftSeven';src:url('font.ttf') format('truetype');font-weight:normal;font-display:swap;}

:root{
  --bg:rgba(10,10,12,.78); --bg-2:rgba(19,19,21,.82);
  --text:#f0f0f0; --muted:#8a8a8e;
  --surface:rgba(255,255,255,.08);
  --surface-2:rgba(255,255,255,.14);
  --border:rgba(255,255,255,.16);
  --border-strong:rgba(255,255,255,.28);
  --field:rgba(255,255,255,.07);
  --btn-bg:#ffffff; --btn-fg:#0a0a0c;
  --specular:rgba(255,255,255,.30);
  --sheen:rgba(255,255,255,.14);
  --halo:rgba(255,255,255,.10);
  --shadow:0 24px 60px rgba(0,0,0,.5);
  --shadow-sm:0 12px 32px rgba(0,0,0,.4);
  --ease:cubic-bezier(.16,1,.3,1);
  --radius:18px; --radius-sm:14px; --pill:999px;
  --nav-h:68px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f4f4f2; --bg-2:#eceae6;
    --text:#101011; --muted:#747477;
    --surface:rgba(255,255,255,.7); --surface-2:rgba(255,255,255,.9);
    --border:rgba(0,0,0,.10); --border-strong:rgba(0,0,0,.16);
    --field:rgba(0,0,0,.045);
    --btn-bg:#050505; --btn-fg:#ffffff;
    --specular:rgba(255,255,255,.95); --sheen:rgba(255,255,255,.6);
    --halo:rgba(0,0,0,.05);
    --shadow:0 24px 55px rgba(30,30,35,.12); --shadow-sm:0 14px 34px rgba(30,30,35,.1);
    color-scheme:light;
  }
}
body.theme-dark{
  --bg:#0a0a0c; --bg-2:#131315; --text:#f0f0f0; --muted:#8a8a8e;
  --surface:rgba(255,255,255,.08); --surface-2:rgba(255,255,255,.14);
  --border:rgba(255,255,255,.16); --border-strong:rgba(255,255,255,.28);
  --field:rgba(255,255,255,.07); --btn-bg:#ffffff; --btn-fg:#0a0a0c;
  --specular:rgba(255,255,255,.30); --sheen:rgba(255,255,255,.14); --halo:rgba(255,255,255,.10);
  --shadow:0 24px 60px rgba(0,0,0,.5); --shadow-sm:0 12px 32px rgba(0,0,0,.4); color-scheme:dark;
}
body.theme-light{
  --bg:#f4f4f2; --bg-2:#eceae6; --text:#101011; --muted:#747477;
  --surface:rgba(255,255,255,.7); --surface-2:rgba(255,255,255,.9);
  --border:rgba(0,0,0,.10); --border-strong:rgba(0,0,0,.16);
  --field:rgba(0,0,0,.045); --btn-bg:#0a0a0c; --btn-fg:#ffffff;
  --specular:rgba(255,255,255,.95); --sheen:rgba(255,255,255,.6); --halo:rgba(0,0,0,.05);
  --shadow:0 24px 55px rgba(30,30,35,.12); --shadow-sm:0 14px 34px rgba(30,30,35,.1); color-scheme:light;
}

*{box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  font-family:'MinecraftSeven',"SF Pro Display","SF Pro Text","SDSans","Segoe UI Variable Display",
    "Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif;
  font-feature-settings:"ss01" 1,"cv01" 1;
  color:var(--text); background:var(--bg); overflow:hidden;
  transition:background .45s var(--ease),color .35s var(--ease);
}
body.theme-light:not(.custom-bg) .app, body.theme-light:not(.custom-bg) .topbar, body.theme-light:not(.custom-bg) nav, body.theme-light:not(.custom-bg) .panel, body.theme-light:not(.custom-bg) .card, body.theme-light:not(.custom-bg) .toast, body.theme-light:not(.custom-bg) .sheet {
  --bg: #f4f4f2; --bg-2: #eceae6;
  --border: rgba(0,0,0,.10);
  --surface-2: rgba(255,255,255,.8);
  --surface: rgba(255,255,255,.55);
}
body::before{
  content:''; position:fixed; inset:-30% -15% auto -15%; height:80vh; z-index:0;
  background:
    radial-gradient(48% 52% at 22% 6%,var(--halo),transparent 60%),
    radial-gradient(42% 48% at 82% 12%,var(--halo),transparent 58%);
  pointer-events:none; opacity:.85;
}
.glass{
  position:relative; background:var(--surface);
  backdrop-filter:blur(16px) saturate(130%); -webkit-backdrop-filter:blur(16px) saturate(130%);
  border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow), inset 0 1px 0 var(--specular);
}
.app{
  position:relative; z-index:1; display:flex; flex-direction:column; height:100vh;
  opacity:0; transform:translateY(8px);
  transition:opacity .8s var(--ease),transform .8s var(--ease);
}
.app.go{opacity:1; transform:none;}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.rise{opacity:0; animation:rise .85s var(--ease) forwards; animation-play-state:paused;}
.app.go .rise{animation-play-state:running;}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}

/* ===== MAIN CONTENT ===== */
.main{flex:1; display:flex; flex-direction:column; min-width:0; background:var(--bg); padding-top:env(safe-area-inset-top,24px); padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px);}
.content{flex:1; overflow-y:auto; padding:16px 18px; position:relative; -webkit-overflow-scrolling:touch;}
.panel{position:absolute; inset:0; display:none; overflow-y:auto; padding:4px 0; -webkit-overflow-scrolling:touch;}
.panel.active{display:block; animation:panelIn .4s var(--ease);}
@keyframes panelIn{from{opacity:0; transform:translateY(10px) scale(.99);}to{opacity:1; transform:none;}}
.panel .ph{display:flex; align-items:center; justify-content:space-between; padding:12px 16px 18px;}
.panel .ph h2{font-size:20px; font-weight:700; letter-spacing:-.02em; margin:0;}
.panel .ph .ph-act{color:var(--muted); font-size:13px; cursor:pointer; padding:8px; border-radius:var(--pill); transition:.2s; min-height:40px; display:flex; align-items:center;}
.panel .ph .ph-act:active{background:var(--surface);}

/* ===== TOP BAR ===== */
.topbar{display:flex; align-items:center; padding:12px 18px 8px; gap:12px; flex:none; margin-top:env(safe-area-inset-top,0px);}
.topbar-left{display:flex; align-items:center; gap:12px; min-width:0; flex:1;}
.topbar-left .icon{width:40px; height:40px; border-radius:12px; display:grid; place-items:center; flex:none; background:var(--surface-2); border:1px solid var(--border);}
.topbar-left .icon svg{width:22px; height:22px; stroke:var(--text);}
.status-dot{width:12px; height:12px; border-radius:50%; flex:none; background:var(--muted); transition:.3s var(--ease);}
.status-dot.on{background:#34c759; box-shadow:0 0 0 4px rgba(52,199,89,.2);}
.status-dot.wait{background:#ff9f0a; animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.status-info{min-width:0}
.status-title{font-size:15px; font-weight:700; letter-spacing:-.01em; color:var(--text);}
.status-sub{font-size:12px; color:var(--muted); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.topbar-right{display:flex; align-items:center; gap:8px; flex:none;}
.theme-btn{width:40px; height:40px; border-radius:12px; display:grid; place-items:center; cursor:pointer; background:var(--surface); border:1px solid var(--border); color:var(--text); transition:.2s; flex:none;}
.theme-btn:active{transform:scale(.92)}
.theme-btn svg{width:18px; height:18px;}

/* ===== HOME ===== */
.home{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:32px 12px 24px;}
.home-icon{width:72px; height:72px; border-radius:22px; margin-bottom:16px;}
.home-title{font-size:22px; font-weight:750; letter-spacing:-.03em; margin:0;}
.home-status{display:flex; align-items:center; gap:8px; margin:12px 0 24px; font-size:14px; color:var(--muted);}
.home-status .dot{width:10px; height:10px; border-radius:50%; flex:none; background:var(--muted); transition:.3s;}
.home-status .dot.on{background:#34c759; box-shadow:0 0 0 3px rgba(52,199,89,.2);}
.home-status .dot.wait{background:#ff9f0a; animation:pulse 1s ease-in-out infinite;}
.home-profile{display:flex; align-items:center; gap:10px; padding:10px 18px; border-radius:var(--pill); background:var(--surface); border:1px solid var(--border); font-size:13px; color:var(--muted); margin-bottom:24px; cursor:pointer; transition:.2s; min-height:44px;}
.home-profile:active{background:var(--surface-2);}
.home-profile .hp-name{color:var(--text); font-weight:650;}
.home-stats{display:flex; gap:24px; margin-top:4px;}
.home-stat{display:flex; flex-direction:column; align-items:center; gap:4px;}
.home-stat .val{font-size:18px; font-weight:700; font-variant-numeric:tabular-nums;}
.home-stat .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}

/* ===== BOTTOM NAV ===== */
nav{position:fixed; bottom:0; left:0; right:0; height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px)); padding-bottom:env(safe-area-inset-bottom,0px); background:var(--bg-2); border-top:1px solid var(--border); display:flex; align-items:center; z-index:100; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); padding-left:4px; padding-right:4px;}
nav .nav-items{display:flex; flex-direction:row; width:100%; height:100%; align-items:center; justify-content:space-around; position:relative;}
nav .nav-item{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:4px 6px; font-size:9px; font-weight:500; color:var(--muted); cursor:pointer; border:none; background:none; text-align:center; min-height:48px; min-width:44px; transition:.2s var(--ease); border-radius:12px; font-family:inherit; flex:1;}
nav .nav-item:active{background:var(--surface);}
nav .nav-item.active{color:var(--text); font-weight:600;}
nav .nav-item svg{width:22px; height:22px; flex:none; opacity:.7;}
nav .nav-item.active svg{opacity:1;}
nav .nav-spacer{flex:0.5;}
nav .fab-wrap{position:relative; display:flex; align-items:center; justify-content:center; flex:0; min-width:0; height:0;}

/* ===== FAB ===== */
.fab{width:60px; height:60px; border-radius:18px; background:var(--btn-bg); color:var(--btn-fg); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 8px 28px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.35); transition:.25s var(--ease); font-size:28px; font-weight:300; line-height:1; position:absolute; bottom:calc(100% - 12px); z-index:101; font-family:inherit;}
.fab:active{transform:scale(.9);}
.fab svg{width:28px; height:28px; stroke:currentColor; fill:none; stroke-width:2.5; stroke-linecap:round;}

/* ===== BOTTOM SHEET ===== */
.sheet-overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; display:none; animation:fadeIn .2s;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{position:fixed; bottom:0; left:0; right:0; z-index:201; transform:translateY(100%); transition:transform .4s var(--ease); max-height:80vh; overflow-y:auto; padding-bottom:env(safe-area-inset-bottom,0px);}
.sheet.open{transform:translateY(0);}
.sheet-inner{background:var(--bg-2); border-radius:24px 24px 0 0; border-top:1px solid var(--border); padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px)); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);}
.sheet-handle{width:36px; height:4px; background:var(--border); border-radius:2px; margin:0 auto 16px;}
.sheet-title{font-size:16px; font-weight:700; margin-bottom:16px; padding:0 4px; letter-spacing:-.01em;}
.sheet-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.sheet-item{display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 8px; border-radius:var(--radius-sm); cursor:pointer; transition:.15s; background:var(--surface); border:1px solid var(--border); text-align:center; min-height:72px;}
.sheet-item:active{background:var(--surface-2); transform:scale(.97);}
.sheet-item .si-icon{width:36px; height:36px; border-radius:10px; display:grid; place-items:center; background:var(--field); border:1px solid var(--border); flex:none;}
.sheet-item .si-icon svg{width:20px; height:20px; stroke:var(--text); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
.sheet-item .si-label{font-size:11px; color:var(--text); font-weight:600; line-height:1.2;}

/* ===== CARDS ===== */
.card{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px; box-shadow:inset 0 1px 0 var(--specular);}
.card h3{margin:0 0 10px; font-size:14px; font-weight:700; letter-spacing:-.01em;}
.card .hint{margin:0 0 10px; font-size:12px; color:var(--muted); line-height:1.5;}
.tg-linked{display:flex; align-items:center; gap:12px; margin:0 0 12px;}
.tg-linked img{width:48px; height:48px; border-radius:14px; object-fit:cover; flex:none; background:var(--surface); border:1px solid var(--border);}
.tg-meta{display:flex; flex-direction:column; gap:2px; flex:1; min-width:0;}
.tg-meta b{font-size:14px; color:var(--text); line-height:1.2;}
.tg-meta i{font-style:normal; font-size:12px; color:var(--muted);}
.tg-form{display:flex; gap:8px;}
.tg-form .field{flex:1;}
.field, textarea, input[type=text], input[type=number], input[type=password]{
  width:100%; background:var(--field); border:1px solid var(--border); border-radius:14px;
  color:var(--text); font-size:14px; padding:12px 14px; outline:none; transition:.2s var(--ease);
  font-family:inherit; -webkit-user-select:text; user-select:text; min-height:44px;}
textarea{min-height:90px; resize:vertical; font-family:ui-monospace,Consolas,monospace; font-size:13px;}
.field:focus, textarea:focus, input:focus{border-color:var(--text); box-shadow:0 0 0 3px var(--halo);}
.field::placeholder,textarea::placeholder{color:var(--muted);}
.btn{position:relative; overflow:hidden; border:0; cursor:pointer; color:var(--btn-fg); font-weight:700; font-size:14px;
  padding:12px 22px; border-radius:var(--pill); background:var(--btn-bg); font-family:inherit;
  box-shadow:0 8px 22px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.3); transition:.26s var(--ease); min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:6px;}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5; pointer-events:none;}
.btn.ghost{background:var(--field); color:var(--text); border:1px solid var(--border); box-shadow:inset 0 1px 0 var(--specular);}
.btn.ghost:active{border-color:var(--border-strong);}
.btn-row{display:flex; gap:10px; flex-wrap:wrap;}

/* ===== CUSTOM BACKGROUND ===== */
:root{--custom-bg:none;}
body.custom-bg{
  /* без перехода подложки: иначе цвет фона тает 0.45s сквозь полупрозрачный слой — это и есть «провал прозрачности» */
  transition:color .35s var(--ease);
  --bg:rgba(8,8,10,.45); --bg-2:rgba(12,12,14,.58);
  --surface:rgba(255,255,255,.14); --surface-2:rgba(255,255,255,.20);
  --field:rgba(255,255,255,.10);
}
/* фон — отдельный fixed-слой: не перерисовывается при скролле и не анимируется */
body.custom-bg::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background-color:rgba(8,8,10,.55);
  background-image:var(--custom-bg);
  background-size:cover; background-position:center; background-repeat:no-repeat;
  transform:translateZ(0);
}
body.custom-bg.theme-light::before{background-color:rgba(246,246,244,.55);}
/* если пропорции фото сильно отличаются от экрана — вписываем целиком (без обрезки) */
body.custom-bg.bg-fit-contain::before{background-size:contain; background-position:center;}
body.custom-bg.theme-light{
  --bg:rgba(246,246,244,.55); --bg-2:rgba(240,240,238,.72);
  --surface:rgba(255,255,255,.55); --surface-2:rgba(255,255,255,.70);
  --field:rgba(0,0,0,.05);
}
body.custom-bg .main{background:transparent;}
/* блюр только на крупных поверхностях (nav, шторка, подсказка) — каждый blur() это
   отдельный backdrop-слой в WebView, десятки таких слоёв = лаги на Android */
body.custom-bg nav, body.custom-bg .sheet-inner, body.custom-bg .tutorial-tooltip{backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);}
body.custom-bg .btn.ghost, body.custom-bg .card, body.custom-bg .srv-card, body.custom-bg .news-card{backdrop-filter:none; -webkit-backdrop-filter:none;}
/* desktop (pywebview/WebView2): backdrop-filter мигает и вешает GPU — вообще без блюра */
body.platform-desktop.custom-bg{
  --bg:rgba(8,8,10,.62); --bg-2:rgba(12,12,14,.74);
  --surface:rgba(255,255,255,.14); --surface-2:rgba(255,255,255,.22);
}
body.platform-desktop.custom-bg.theme-light{
  --bg:rgba(246,246,244,.72); --bg-2:rgba(240,240,238,.84);
  --surface:rgba(255,255,255,.6); --surface-2:rgba(255,255,255,.75);
}
body.platform-desktop.custom-bg .btn.ghost,
body.platform-desktop.custom-bg .card,
body.platform-desktop.custom-bg .srv-card,
body.platform-desktop.custom-bg .news-card,
body.platform-desktop.custom-bg nav,
body.platform-desktop.custom-bg .sheet-inner,
body.platform-desktop.custom-bg .tutorial-tooltip{backdrop-filter:none; -webkit-backdrop-filter:none;}
body.custom-bg .lbl, body.custom-bg .val,
body.custom-bg .srv-name, body.custom-bg .srv-meta,
body.custom-bg .news-date, body.custom-bg .news-desc,
body.custom-bg .home-status, body.custom-bg .home-profile,
body.custom-bg .topbar-left .icon{text-shadow:0 1px 3px rgba(0,0,0,.35);}
body.custom-bg.theme-light .lbl, body.custom-bg.theme-light .val,
body.custom-bg.theme-light .srv-name, body.custom-bg.theme-light .srv-meta,
body.custom-bg.theme-light .news-date, body.custom-bg.theme-light .news-desc,
body.custom-bg.theme-light .home-status, body.custom-bg.theme-light .home-profile,
body.custom-bg.theme-light .topbar-left .icon{text-shadow:0 1px 2px rgba(255,255,255,.35);}
button:disabled, button.locked{opacity:.45; cursor:default;}
button:disabled:active, button.locked:active{transform:none;}

/* ===== SERVER CARD ===== */
.srv-list{display:flex; flex-direction:column; gap:10px;}
.srv-card{position:relative; overflow:hidden; display:flex; align-items:center; gap:14px; padding:14px 16px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); cursor:pointer; transition:.24s var(--ease); box-shadow:inset 0 1px 0 var(--specular); min-height:60px;}
.srv-card:active{transform:scale(.98)}
.srv-card.sel{border-color:var(--text); box-shadow:0 0 0 1px var(--text), inset 0 1px 0 var(--specular);}
.srv-flag{width:40px; height:28px; border-radius:6px; flex:none; display:grid; place-items:center; background:var(--field); border:1px solid var(--border); font-size:16px;}
.srv-info{flex:1; min-width:0;}
.srv-name{font-weight:650; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.srv-meta{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:3px;}
.srv-meta span{font-size:10.5px; color:var(--muted);}
.srv-meta .proto{font-size:9.5px; font-weight:700; letter-spacing:.04em; padding:2px 7px; border-radius:6px; background:var(--field); border:1px solid var(--border); color:var(--text);}
.srv-ping{font-size:12px; font-weight:700; color:var(--muted); min-width:48px; text-align:right; flex:none;}
.srv-ping.good{color:#34c759} .srv-ping.mid{color:var(--text)}
.srv-ping.bad{color:var(--muted); opacity:.7;}
.srv-card .del-btn{width:36px; height:36px; border-radius:10px; border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:15px; transition:.2s var(--ease); flex:none; display:grid; place-items:center;}
.srv-card .del-btn:active{background:var(--text); color:var(--bg);}
.srv-empty{color:var(--muted); text-align:center; padding:48px 20px; font-size:14px; line-height:1.7; white-space:pre-line;}

/* ===== SETTINGS ===== */
.set-group{margin-bottom:20px;}
.set-group .sg-title{font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); padding:0 4px 10px;}
.set-row{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:13px 0; border-bottom:1px solid var(--border); min-height:48px;}
.set-row:last-of-type{border-bottom:0;}
.set-row .lbl{font-size:13px; flex:1; min-width:0;}
.set-row .lbl i{display:block; font-style:normal; font-size:11px; color:var(--muted); margin-top:2px;}
.set-row .ctl{flex:none; width:120px;} .set-row .ctl.narrow{width:80px;}
.switch{position:relative; width:50px; height:30px; flex:none;}
.switch input{display:none;}
.switch .track{position:absolute; inset:0; background:var(--field); border:1px solid var(--border); border-radius:var(--pill); transition:.32s var(--ease); cursor:pointer; box-shadow:inset 0 1px 3px rgba(0,0,0,.15);}
.switch .track::after{content:''; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:var(--text); transition:.32s var(--ease); box-shadow:0 3px 10px rgba(0,0,0,.35);}
.switch input:checked + .track{background:var(--text); border-color:var(--text);}
.switch input:checked + .track::after{transform:translateX(20px); background:var(--bg);}

/* ===== PROFILE ===== */
.prof-head{display:flex; align-items:center; gap:16px;}
.prof-avatar{width:56px; height:56px; border-radius:18px; flex:none; overflow:hidden;}
.prof-avatar img{width:100%; height:100%; object-fit:cover; display:block; border-radius:18px;}
.prof-id{flex:1; min-width:0;}
.prof-name{font-size:18px; font-weight:750; letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.prof-name.mono{font-family:ui-monospace,Consolas,monospace;}
.prof-role{color:var(--muted); font-size:12px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.prof-badge{flex:none; font-size:10px; font-weight:700; letter-spacing:.03em; padding:6px 12px; border-radius:var(--pill); background:var(--text); color:var(--bg);}
.pv-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 0; border-bottom:1px solid var(--border); font-size:13px;}
.pv-row:last-child{border-bottom:0;}
.pv-row span{color:var(--muted);} .pv-row b{font-weight:700; text-align:right;}
.pv{display:inline-flex; align-items:center; gap:6px;}
.pv-on::before{content:''; width:7px; height:7px; border-radius:50%; background:var(--text); box-shadow:0 0 0 3px var(--halo);}
.usage{margin:4px 0 12px;}
.usage-top{display:flex; justify-content:space-between; align-items:baseline; font-size:12px; margin-bottom:8px;}
.usage-top b{font-size:14px; font-weight:750;}
.usage-top span{color:var(--muted);}
.bar{height:8px; border-radius:var(--pill); background:var(--field); border:1px solid var(--border); overflow:hidden;}
.bar > i{display:block; height:100%; width:0; background:var(--text); border-radius:var(--pill); transition:width .8s var(--ease);}
.bar.low > i{opacity:.45;}
.stars{display:flex; gap:6px; font-size:26px; line-height:1; cursor:pointer;}
.star{position:relative; color:var(--muted); opacity:.4; transition:.2s var(--ease);}
.star.on{color:var(--text); opacity:1; transform:scale(1.05);}
.support-btn{width:100%; margin-top:0;}

/* ===== NEWS ===== */
.news-list{display:flex; flex-direction:column; gap:12px;}
.news-card{padding:16px 18px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); box-shadow:inset 0 1px 0 var(--specular);}
.news-date{font-size:11px; color:var(--muted); margin-bottom:6px;}
.news-title{font-size:15px; font-weight:700; margin-bottom:6px; line-height:1.3;}
.news-desc{font-size:13px; color:var(--muted); line-height:1.65;}
.news-desc a{color:var(--text); text-decoration:underline; text-underline-offset:2px;}
.news-desc code{background:var(--field); padding:2px 5px; border-radius:5px; font-family:ui-monospace,Consolas,monospace; font-size:12px;}
.news-desc pre{background:var(--field); padding:10px 12px; border-radius:10px; overflow-x:auto; font-family:ui-monospace,Consolas,monospace; font-size:11.5px; line-height:1.5; margin:8px 0;}
.news-desc blockquote{border-left:3px solid var(--text); padding:6px 12px; margin:8px 0; color:var(--muted); font-style:italic;}
.news-empty{color:var(--muted); text-align:center; padding:40px 20px; font-size:13px;}
.news-pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2ecc71;margin-left:4px;animation:newsPulseGreen 1.2s ease-in-out infinite;box-shadow:0 0 5px #2ecc71;vertical-align:middle}
@keyframes newsPulseGreen{0%,100%{opacity:1;transform:scale(1);box-shadow:0 0 5px #2ecc71;}50%{opacity:.5;transform:scale(.6);box-shadow:0 0 10px #2ecc71;}}

/* ===== LOGS ===== */
.log-list{display:flex; flex-direction:column; gap:6px;}
.log-card{display:flex; align-items:flex-start; gap:10px; padding:10px 14px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); font-size:12px; line-height:1.5; border-left:3px solid var(--muted); min-height:40px;}
.log-card .lc-ts{color:var(--muted); font-size:10px; white-space:nowrap; flex:none; margin-top:1px;}
.log-card .lc-msg{flex:1; word-break:break-word;}
.log-card.ok{border-left-color:#34c759;}
.log-card.err{border-left-color:#ff3b30;}
.log-card.warn{border-left-color:#ff9f0a;}

/* ===== ROUTES ===== */
.seg{display:flex; gap:4px; background:var(--field); border:1px solid var(--border); border-radius:var(--pill); padding:4px; margin-bottom:6px;}
.seg button{flex:1; border:0; background:transparent; color:var(--muted); font-family:inherit; font-weight:650; font-size:12.5px; padding:10px 8px; border-radius:var(--pill); cursor:pointer; transition:.3s var(--ease); position:relative; overflow:hidden; min-height:40px;}
.seg button.active{background:var(--text); color:var(--bg); box-shadow:0 4px 16px rgba(0,0,0,.22);}

/* ===== RIPPLE ===== */
.ripple{position:absolute; border-radius:50%; pointer-events:none; z-index:5; color:inherit;
  background:radial-gradient(circle, currentColor 0%, transparent 62%); opacity:.30; transform:scale(0);
  animation:rippleWave .85s var(--ease) forwards;}
.ripple::after{content:''; position:absolute; inset:0; border-radius:50%;
  border:2px solid currentColor; opacity:.5; transform:scale(.25); animation:ringWave .85s var(--ease) forwards;}
@keyframes rippleWave{to{transform:scale(1); opacity:0;}}
@keyframes ringWave{to{transform:scale(1); opacity:0;}}

/* ===== INTRO ===== */
#intro{position:fixed; inset:0; z-index:200; overflow-y:auto; background:linear-gradient(145deg,#f8f9fc,#eef0f5); color:#1c1c1e; transition:opacity .7s var(--ease),transform .7s var(--ease);}
#intro.gone{opacity:0; transform:scale(1.05); pointer-events:none;}
.intro-screen{position:absolute; inset:0; display:grid; place-items:center; padding:30px 24px; text-align:center;
  opacity:0; visibility:hidden; transform:translateY(20px) scale(.99); filter:blur(8px);
  transition:opacity .75s var(--ease),transform .75s var(--ease),filter .75s var(--ease),visibility .75s;}
.intro-screen.active{opacity:1; visibility:visible; transform:none; filter:blur(0);}
.intro-inner{position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; max-width:400px; width:100%;}
@keyframes introRise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes iconPop{0%{opacity:0;transform:scale(.6)}62%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
.intro-icon{width:88px; height:88px; border-radius:22px; margin-bottom:18px; animation:iconPop 1s var(--ease) both; background:rgba(0,0,0,.04); border:1px solid rgba(0,0,0,.08); display:grid; place-items:center; box-shadow:0 8px 30px rgba(0,0,0,.06);}
.intro-icon svg{width:50px; height:50px; stroke:#1c1c1e; stroke-width:1.6; fill:none;}
.intro-tag{font-size:11px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:#8a8a8e; opacity:0; animation:introRise .9s var(--ease) .35s forwards;}
.intro-title{font-size:30px; font-weight:750; letter-spacing:-.02em; margin:8px 0 0; color:#1c1c1e; opacity:0; animation:introRise .9s var(--ease) .48s forwards;}
.intro-sub{font-size:14px; color:#636366; line-height:1.55; margin:10px 0 0; max-width:340px; opacity:0; animation:introRise .9s var(--ease) .62s forwards;}
.intro-btn{position:relative; overflow:hidden; margin-top:24px; border:0; cursor:pointer; color:#fff; font-size:15px; font-weight:700; padding:0 28px; height:50px; min-width:210px; border-radius:var(--pill); background:#1c1c1e; display:inline-flex; align-items:center; justify-content:center; gap:10px; font-family:inherit; box-shadow:0 8px 28px rgba(0,0,0,.18); transition:.3s var(--ease);}
.intro-btn:disabled{opacity:.3!important; cursor:default; pointer-events:none; box-shadow:none;}
.intro-btn:active:not(:disabled){transform:scale(.97)}
.intro-btn .spin{width:16px; height:16px; border:2px solid rgba(255,255,255,.5); border-right-color:#fff; border-radius:50%; display:none; animation:spin .7s linear infinite;}
.intro-btn.loading .spin{display:inline-block;}
.intro-btn.loading .lbl{display:none;}
@keyframes spin{to{transform:rotate(360deg)}}
.sub-intro-form{display:flex; gap:10px; width:100%; max-width:360px; margin-top:18px; opacity:0; animation:introRise .9s var(--ease) .7s forwards;}
.sub-intro-form .field{flex:1; text-align:center; font-size:14px; padding:14px; border-radius:var(--pill); min-height:48px; background:#fff; border:1.5px solid rgba(0,0,0,.12); color:#1c1c1e; font-weight:500;}
.sub-intro-form .field:focus{border-color:#1c1c1e; box-shadow:0 0 0 3px rgba(28,28,30,.12);}
.sub-intro-hint{margin-top:10px; font-size:12px; color:#8a8a8e; line-height:1.5; max-width:360px; opacity:0; animation:introRise .9s var(--ease) .76s forwards;}
.sub-intro-link{color:#1c1c1e; font-weight:650; text-decoration:underline; text-underline-offset:2px;}
.intro-error{margin-top:12px; padding:10px 14px; font-size:12px; color:#1c1c1e; font-weight:650; background:rgba(255,59,48,.1); border:1px solid rgba(255,59,48,.3); border-radius:var(--pill); text-align:center; max-width:360px; opacity:0; animation:introRise .6s var(--ease) forwards;}
.intro-error[hidden]{display:none;}
.hub-badge{display:inline-flex; align-items:center; gap:8px; font-size:11px; font-weight:650; color:#1c1c1e; padding:8px 14px; border-radius:var(--pill); background:rgba(0,0,0,.06); border:1px solid rgba(0,0,0,.1); margin-bottom:16px;}
.hub-badge::before{content:''; width:7px; height:7px; border-radius:50%; background:#1c1c1e; box-shadow:0 0 0 3px rgba(28,28,30,.15);}
.hub-icon{width:72px; height:72px; border-radius:18px; margin-bottom:14px; background:rgba(0,0,0,.04); border:1px solid rgba(0,0,0,.08); display:grid; place-items:center; box-shadow:0 8px 25px rgba(0,0,0,.05);}
.hub-icon svg{width:40px; height:40px; stroke:#1c1c1e; stroke-width:1.6; fill:none;}
.hub-title{font-size:28px; font-weight:750; letter-spacing:-.02em; margin:0; color:#1c1c1e;}
.hub-text{margin:12px 0 0; max-width:380px;}
.hub-text p{margin:0 0 8px; font-size:13px; line-height:1.6; color:#636366; text-align:center;}
.hub-text p:last-child{margin-bottom:0; color:#1c1c1e;}

/* ===== TUTORIAL ===== */
.tutorial-overlay{position:fixed; inset:0; z-index:300; background:rgba(0,0,0,.72); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center;}
.tutorial-overlay.active{display:flex;}
.tutorial-highlight{position:fixed; z-index:301; border:2px solid var(--text); border-radius:14px; box-shadow:0 0 0 4000px rgba(0,0,0,.65); pointer-events:none; transition:all .45s var(--ease);}
.tutorial-tooltip{position:fixed; z-index:302; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; max-width:320px; width:calc(100vw - 32px); box-shadow:var(--shadow); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);}
.tutorial-tooltip h3{margin:0 0 6px; font-size:15px; font-weight:700;}
.tutorial-tooltip p{margin:0 0 14px; font-size:12.5px; color:var(--muted); line-height:1.5;}
.tutorial-tooltip .btn-row{justify-content:flex-end;}
.tutorial-tooltip .btn-row button{padding:8px 16px; font-size:12px; min-height:40px;}
.tutorial-progress{display:flex; gap:5px; margin-bottom:12px;}
.tutorial-progress span{width:7px; height:7px; border-radius:50%; background:var(--border); transition:.3s var(--ease);}
.tutorial-progress span.done{background:var(--text);}

/* ===== TOAST ===== */
.toast{position:fixed; bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px)); left:50%; transform:translate(-50%,140%);
  background:var(--surface-2); border:1px solid var(--border); border-radius:var(--pill); padding:12px 22px; font-size:13px; font-weight:650; box-shadow:var(--shadow); z-index:150; transition:transform .45s var(--ease),opacity .45s var(--ease); max-width:85vw; color:var(--text); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); opacity:0; pointer-events:none; visibility:hidden;}
.toast.show{transform:translate(-50%,0); opacity:1; pointer-events:auto; visibility:visible;}
.toast.err{border-color:var(--border-strong);}

/* ===== CONNECTION OVERLAY ===== */
.conn-overlay{position:fixed;inset:0;z-index:250;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.conn-overlay.show{display:flex;}
.conn-box{background:var(--bg-2);border:1px solid var(--border);border-radius:24px;padding:32px 28px;max-width:340px;width:90vw;text-align:center;box-shadow:var(--shadow);}
.conn-spinner{width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--text);border-radius:50%;animation:connSpin .8s linear infinite;margin:0 auto 18px;}
@keyframes connSpin{to{transform:rotate(360deg)}}
.conn-server{font-size:15px;font-weight:700;margin-bottom:6px;}
.conn-status-text{font-size:13px;color:var(--muted);margin-bottom:20px;}
.conn-cancel-btn{border:0;background:var(--surface);color:var(--text);font-family:inherit;font-weight:600;font-size:13px;padding:10px 24px;border-radius:var(--pill);cursor:pointer;transition:.2s;min-height:40px;border:1px solid var(--border);}
.conn-cancel-btn:active{transform:scale(.97);}
.conn-success{color:#34c759;font-size:42px;margin-bottom:8px;}
.conn-info{text-align:left;margin-top:16px;}
.conn-info-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:1px solid var(--border);}
.conn-info-row:last-child{border-bottom:0;}
.conn-info-row .cil{color:var(--muted);}
.conn-info-row .cir{font-weight:600;text-align:right;}
.conn-err-icon{color:#ff3b30;font-size:42px;margin-bottom:8px;}
.conn-err-msg{font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.5;}
.conn-err-btns{display:flex;flex-direction:column;gap:8px;}
.conn-err-btns button{border:0;background:var(--surface);color:var(--text);font-family:inherit;font-weight:600;font-size:13px;padding:10px 20px;border-radius:var(--pill);cursor:pointer;transition:.2s;min-height:40px;border:1px solid var(--border);}
.conn-err-btns button:active{transform:scale(.97);}
.conn-err-btns button.primary{background:var(--btn-bg);color:var(--btn-fg);border:0;}

/* ===== MISC ===== */
.ios-tile{position:relative; display:grid; place-items:center; overflow:hidden; color:var(--text); background:linear-gradient(155deg,var(--surface-2),var(--surface)); border:1px solid var(--border-strong); box-shadow:var(--shadow), inset 0 1.5px 0 var(--specular), inset 0 -14px 30px rgba(0,0,0,.18);}
.ios-tile svg{width:58%; height:58%; position:relative; z-index:2; stroke:var(--text); filter:drop-shadow(0 2px 6px rgba(0,0,0,.25));}
.ios-tile .glow{position:absolute; inset:0; z-index:1; background:radial-gradient(60% 55% at 30% 18%,var(--sheen),transparent 60%);}
.desktop-only{display:none!important}
.build-info{text-align:center; padding:14px 0 4px; font-size:11px; color:var(--muted); opacity:.6;}
#snowCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999;display:none}

/* ===== RESPONSIVE ===== */
@media (min-width:600px){
  .sheet-grid{grid-template-columns:1fr 1fr 1fr;}
  .content{padding:24px 28px;}
  .home{padding:48px 24px 32px;}
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s!important; animation-iteration-count:1!important; transition-duration:.15s!important;}
  .orb{animation:none!important;}
}

window.__bgImg=null;
function applyBgFit(img){
  if(!img||!img.naturalWidth||!img.naturalHeight) return;
  const ir=img.naturalWidth/img.naturalHeight;
  const vr=window.innerWidth/window.innerHeight;
  document.body.classList.toggle("bg-fit-contain", Math.abs(ir-vr)/Math.max(ir,vr)>0.22);
}
window.addEventListener("resize", ()=>{
  if(window.__bgImg && document.body.classList.contains("custom-bg")) applyBgFit(window.__bgImg);
});
function applyCustomBg(){
  const s=bgActive()?(STATE.settings.custom_bg||""):"";
  const el=document.documentElement;
  if(s){
    const prop='url("'+s+'")';
    if(el.style.getPropertyValue("--custom-bg")!==prop) el.style.setProperty("--custom-bg",prop);
    if(!document.body.classList.contains("custom-bg")){
      /* предзагрузка: класс вешаем только когда картинка уже декодирована,
         иначе подложка тает сквозь полупрозрачные слои до её появления */
      const img=new Image();
      img.onload=()=>{ window.__bgImg=img; applyBgFit(img); document.body.classList.add("custom-bg"); };
      img.onerror=()=>document.body.classList.add("custom-bg");
      img.src=s;
    }
  }else{
    window.__bgImg=null;
    document.body.classList.remove("custom-bg");
    document.body.classList.remove("bg-fit-contain");
    el.style.setProperty("--custom-bg","none");
  }
  updateThemeLock();
}

};

function pickDesktopFont(){
  const input=document.createElement("input"); input.type="file"; input.accept=".ttf,.otf,.woff,.woff2";
  input.onchange=(e)=>{
    const file=e.target.files[0]; if(!file) return;

    reader.onload=async()=>{
      const b64=String(reader.result||"").split(",",2)[1]||"";

      try{

  };
  input.click();
}

function fmtBytes(n){
  n = Number(n)||0; const u=["Б","КБ","МБ","ГБ","ТБ"]; let i=0;
  while(n>=1024 && i<u.length-1){ n/=1024; i++; }
  return (i===0 ? n.toFixed(0) : (n>=100 ? n.toFixed(0) : n.toFixed(n>=10?1:2))) + " " + u[i];
}
function fmtSpeed(n){ return fmtBytes(n) + "/с"; }

    _newsDisabled=!!r.disabled; $("newsOffToggle").checked=_newsDisabled;
    if(r.html){ renderNews("newsFeed", r.html, r.date); }else{ $("newsFeed").innerHTML=`<div class="news-empty">${t("news_no_posts")}</div>`; }
    if(r.post_id&&r.post_id!==_newsPostId&&_newsPostId){ const tab=document.querySelector('.nav-item[data-tab="news"]'); if(tab&&!tab.classList.contains("active")){ if(!tab.querySelector(".news-pulse")){const p=document.createElement("span");p.className="news-pulse";tab.appendChild(p);} } }
    _newsPostId=r.post_id||""; if(typeof AndroidBridge!=="undefined"){ try{ STATE=JSON.parse(AndroidBridge.call("save_settings",JSON.stringify([{last_news_id:_newsPostId||""}]))); }catch(err){} } else if(api()){ STATE=await api().save_settings({last_news_id:_newsPostId||""}); }
  }catch(e){}
  try{
    let sr;
    if(typeof AndroidBridge!=="undefined"){
      sr = await new Promise(resolve=>{ window.__supportNewsResult=resolve; setTimeout(()=>resolve(null),15000); try{AndroidBridge.call("get_support_news_async","[]");}catch(e){resolve(null);} });
    }else{
      sr = await api().get_support_news();
    }
    const card=$("otherNewsCard");
    if(sr&&sr.ok&&sr.html&&!/channel\s*created/i.test(sr.html)){ renderNews("supportFeed", sr.html, sr.date); if(card)card.style.display=""; } else if(card)card.style.display="none";
  }catch(e){}
}
function renderNews(feedId,html,date){
  let dateStr=""; if(date){ try{const d=new Date(date);dateStr=d.toLocaleDateString(LANG==="en"?"en-GB":"ru-RU",{day:"2-digit",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"});}catch(e){} }
  const el=$(feedId); if(!el) return; el.innerHTML=`<div class="news-card"><div class="news-date">${sanitize(dateStr)}</div><div class="news-desc">${html}</div></div>`;
}
$("newsOffToggle").addEventListener("change",async()=>{_newsDisabled=$("newsOffToggle").checked; if(typeof AndroidBridge!=="undefined"){ try{ STATE=JSON.parse(AndroidBridge.call("save_settings",JSON.stringify([{news_off:_newsDisabled}]))); }catch(err){} } else if(api()){ STATE=await api().save_settings({news_off:_newsDisabled}); } });

/* ===== BUILD INFO ===== */
async function loadBuildInfo(){ try{let r; if(typeof AndroidBridge!=="undefined"){r=JSON.parse(AndroidBridge.call("get_build_info","[]"));}else{ if(!api())return; r=await api().get_build_info(); } if(!r)return; $("buildInfo").textContent=r.version+" · "+r.date; $("sysinfoVersion").textContent=r.version; $("sysinfoDate").textContent=r.date; $("sysinfoPlatform").textContent=r.platform||"Android"; }catch(e){} }

/* ===== SNOW ===== */
var _snowCanvas=null,_snowCtx=null,_snowFlakes=[],_snowAnim=null,_snowOn=false;
function initSnow(){ if(_snowCanvas)return; _snowCanvas=document.createElement("canvas");_snowCanvas.id="snowCanvas";document.body.appendChild(_snowCanvas); _snowCtx=_snowCanvas.getContext("2d"); function resize(){if(_snowCanvas){_snowCanvas.width=window.innerWidth;_snowCanvas.height=window.innerHeight;}}window.addEventListener("resize",resize);resize(); }
function toggleSnow(on){ if(!_snowCanvas)initSnow();_snowOn=on; if(!_snowCanvas)return; if(!on){_snowCanvas.style.display="none";if(_snowAnim){cancelAnimationFrame(_snowAnim);_snowAnim=null;}return;} _snowCanvas.style.display="block";_snowFlakes=[]; const count=Math.min(120,Math.max(40,Math.floor(window.innerWidth/8))); for(let i=0;i<count;i++){_snowFlakes.push({x:Math.random()*_snowCanvas.width,y:Math.random()*_snowCanvas.height,r:Math.random()*3+1.5,d:Math.random()*80+20,s:Math.random()*.6+.4,o:Math.random()*.5+.3,vx:(Math.random()-.5)*.3});} if(_snowAnim)cancelAnimationFrame(_snowAnim); function draw(){ if(!_snowCanvas||!_snowCtx||!_snowOn){_snowAnim=null;return;} _snowCtx.clearRect(0,0,_snowCanvas.width,_snowCanvas.height); const isDark=!document.body.classList.contains("theme-light"); const bc=isDark?"255,255,255":"200,200,255"; for(const f of _snowFlakes){f.y+=f.s;f.x+=Math.sin(f.y/f.d)*.3+f.vx;if(f.y>_snowCanvas.height){f.y=-f.r;f.x=Math.random()*_snowCanvas.width;} _snowCtx.beginPath();_snowCtx.arc(f.x,f.y,f.r*1.8,0,Math.PI*2);_snowCtx.fillStyle="rgba("+bc+","+(f.o*.2)+")";_snowCtx.fill(); _snowCtx.beginPath();_snowCtx.arc(f.x,f.y,f.r,0,Math.PI*2);_snowCtx.fillStyle="rgba("+bc+","+f.o+")";_snowCtx.fill();} _snowAnim=requestAnimationFrame(draw);} draw(); }
$("snowToggle").addEventListener("change",async()=>{const on=$("snowToggle").checked;if(api())STATE=await api().save_settings({snow_enabled:on});if(STATE.connected)toggleSnow(on);});

/* ===== INTRO ===== */
function revealApp(){ const intro=$("intro"); if(intro){intro.classList.add("gone");setTimeout(()=>intro.remove(),700);} document.body.classList.remove("intro-active"); showApp(); }
function introGo(from,to){ $(from).classList.remove("active"); $(to).classList.add("active"); }
let _subReady=false;
$("subInput").addEventListener("input",()=>{if(_subReady){_subReady=false;$("subNextBtn").disabled=true;}});
$("subInput").addEventListener("keydown",e=>{if(e.key==="Enter"){if($("subNextBtn").disabled)tryImportSub();else $("subNextBtn").click();}});
let _importingSub=false;
window.__importResult = null;
window.__importSubResult = null;
window.__refreshSubResult = null;
window.__connectResult = null;
async function tryImportSub(){ if(_importingSub)return; const v=($("subInput").value||"").trim(); if(!v)return; if(!/^https?:\/\/.+/i.test(v)){showSubError(t("welcome_err_format"));return;} _importingSub=true;const btn=$("subNextBtn");btn.classList.add("loading");hideSubError(); try{AndroidBridge.call("import_subscription_async",JSON.stringify([v]));}catch(e){showSubError(t("err_generic")+e);btn.classList.remove("loading");_importingSub=false;} }
window.__importResult = function(r){
  const btn=$("subNextBtn");
  _importingSub=false;
  if(!btn)return;
  if(r.error){
    const msg=r.error==="html_response"?t("welcome_err_invalid"):r.error==="empty_sub"?t("welcome_err_empty"):r.error==="wrong_domain"?t("welcome_err_format"):I18N[LANG]["err_"+r.error]||t("err_generic")+r.error;
    showSubError(msg);btn.classList.remove("loading");return;
  }
  STATE=r.state;
  // Request VPN permission, then auto-connect via __vpnPermissionGranted
  try{AndroidBridge.call("request_vpn_permission","[]");}catch(e){showSubError(t("err_generic")+e);btn.classList.remove("loading");}
};
window.__connectResult = function(r){
  STATE = r.state || STATE;
  updateHome();
  if(STATE.connected){
    const sv = STATE.servers[STATE.selected];
    if(sv && CONN_PHASE === "connecting") showConnected(sv);
  } else {
    if(CONN_PHASE === "connecting") showConnError(t("connection_error"));
  }
  // Intro flow
  const btn=$("subNextBtn");
  if(!btn)return;
  if(r.error){showSubError(t("welcome_err_connect"));btn.classList.remove("loading");return;}
  setTimeout(()=>{
    _subReady=true;btn.disabled=false;btn.classList.remove("loading");
    if(CONN_PHASE) showConnOverlay(null);
    if(STATE.connected) toast(t("welcome_success"));
  },1500);
};
function showSubError(msg){const el=$("subError");el.textContent=msg;el.hidden=false;}
function hideSubError(){$("subError").hidden=true;}
$("subNextBtn").addEventListener("click",()=>{if(!_subReady)return;introGo("introSub","introS2");});
$("introContinue").addEventListener("click",async()=>{try{if(api())STATE=await api().finish_intro();}catch(e){} revealApp(); if(!STATE.tutorial_done)setTimeout(()=>startTutorial(),600);});
document.addEventListener("click",e=>{const el=e.target.closest("[data-ext]");if(!el)return;e.preventDefault();const u=el.getAttribute("data-ext");if(!u)return;if(typeof AndroidBridge!=="undefined"){try{AndroidBridge.call("open_external",JSON.stringify([u]));}catch(err){}}else if(api()){api().open_external(u).catch(()=>{});}});

/* ===== RIPPLE ===== */
document.addEventListener("pointerdown",e=>{const el=e.target.closest("button,.srv-card,.star,.sheet-item,.home-profile");if(!el)return;const cs=getComputedStyle(el);if(cs.position==="static")el.style.position="relative";if(cs.overflow==="visible")el.style.overflow="hidden";const r=el.getBoundingClientRect();const size=Math.max(r.width,r.height)*1.35;const x=(e.clientX!=null?e.clientX:r.left+r.width/2)-r.left;const y=(e.clientY!=null?e.clientY:r.top+r.height/2)-r.top;const rip=document.createElement("span");rip.className="ripple";rip.style.width=rip.style.height=size+"px";rip.style.left=(x-size/2)+"px";rip.style.top=(y-size/2)+"px";el.appendChild(rip);setTimeout(()=>rip.remove(),880);});

/* ===== INIT ===== */
let _initCalled=false;
async function initEnhanced(){
  if(_initCalled)return;_initCalled=true;
  try{
    if(api())STATE=await api().get_state();
    const s=STATE.settings||{}; THEME=s.theme||"auto";applyTheme(); applyLang(s.lang||"ru"); applyCustomFont();
    fillSettings();renderServers();updateHome();renderProfile();renderRoutes();
    CONFLICTS=STATE.conflicts||[];
    try{loadBuildInfo();}catch(e){}
    initSnow(); const snowOn=!!(s.snow_enabled); if($("snowToggle"))$("snowToggle").checked=snowOn; if(snowOn&&STATE.connected)toggleSnow(true);
    const hasSub=STATE.settings&&STATE.settings.subscription_url;
    setInterval(async()=>{if(document.hidden)return;try{const st=typeof AndroidBridge!=="undefined"?JSON.parse(AndroidBridge.call("get_state","[]")):await api().get_state();const changed=st.tun_active!==STATE.tun_active||st.connected!==STATE.connected;STATE=st;CONFLICTS=STATE.conflicts||[];updateHome();if(changed&&st.connected){const sv=STATE.servers[STATE.selected];if(sv&&CONN_PHASE==="connecting")showConnected(sv);}}catch(e){}},3000);
    if(hasSub){
      if(STATE.servers.length===0){window.__refreshSubResult=function(r){if(r&&r.state)STATE=r.state;};AndroidBridge.call("refresh_subscription","");}
      const intro=$("intro");if(intro)intro.remove();document.body.classList.remove("intro-active");showApp();
      if(!STATE.tutorial_done)setTimeout(()=>startTutorial(),600);
      try{checkNews();}catch(e){}
      return;
    }
    document.body.classList.add("intro-active"); $("introSub").classList.add("active"); $("subInput").focus();
    try{checkNews();}catch(e){}
  }catch(e){}
}
