<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEDOKOL HUB</title>
<style>
/* ==================================================================
   LEDOKOL HUB · Ledokol VPN
   Монохром (чёрное/белое), стиль nextgram.pro. Шрифт SF Pro («SDSans»).
   Оптимизировано: backdrop-filter только на иконках и верхних панелях,
   без бесконечных анимаций за стеклом — чтобы не грузить память/GPU.
   ================================================================== */

:root{
  --bg:#0a0a0c; --bg-2:#131315;
  --text:#f0f0f0; --muted:#8a8a8e;
  --surface:rgba(255,255,255,.08);
  --surface-2:rgba(255,255,255,.14);
  --border:rgba(255,255,255,.16);
  --border-strong:rgba(255,255,255,.28);
  --field:rgba(255,255,255,.07);
  --btn-bg:#ffffff; --btn-fg:#0a0a0c;
  --specular:rgba(255,255,255,.30);
  --sheen:rgba(255,255,255,.14);
  --halo:rgba(255,255,255,.10);
  --shadow:0 24px 60px rgba(0,0,0,.5);
  --shadow-sm:0 12px 32px rgba(0,0,0,.4);
  --ease:cubic-bezier(.16,1,.3,1);
  --radius:26px; --radius-sm:18px; --pill:999px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f4f4f2; --bg-2:#eceae6;
    --text:#101011; --muted:#747477;
    --surface:rgba(255,255,255,.7); --surface-2:rgba(255,255,255,.9);
    --border:rgba(0,0,0,.10); --border-strong:rgba(0,0,0,.16);
    --field:rgba(0,0,0,.045);
    --btn-bg:#050505; --btn-fg:#ffffff;
    --specular:rgba(255,255,255,.95); --sheen:rgba(255,255,255,.6);
    --halo:rgba(0,0,0,.05);
    --shadow:0 24px 55px rgba(30,30,35,.12); --shadow-sm:0 14px 34px rgba(30,30,35,.1);
    color-scheme:light;
  }
}
body.theme-dark{
  --bg:#0a0a0c; --bg-2:#131315; --text:#f0f0f0; --muted:#8a8a8e;
  --surface:rgba(255,255,255,.08); --surface-2:rgba(255,255,255,.14);
  --border:rgba(255,255,255,.16); --border-strong:rgba(255,255,255,.28);
  --field:rgba(255,255,255,.07); --btn-bg:#ffffff; --btn-fg:#0a0a0c;
  --specular:rgba(255,255,255,.30); --sheen:rgba(255,255,255,.14); --halo:rgba(255,255,255,.10);
  --shadow:0 24px 60px rgba(0,0,0,.5); --shadow-sm:0 12px 32px rgba(0,0,0,.4); color-scheme:dark;
}
body.theme-light{
  --bg:#f4f4f2; --bg-2:#eceae6; --text:#101011; --muted:#747477;
  --surface:rgba(255,255,255,.7); --surface-2:rgba(255,255,255,.9);
  --border:rgba(0,0,0,.10); --border-strong:rgba(0,0,0,.16);
  --field:rgba(0,0,0,.045); --btn-bg:#0a0a0c; --btn-fg:#ffffff;
  --specular:rgba(255,255,255,.95); --sheen:rgba(255,255,255,.6); --halo:rgba(0,0,0,.05);
  --shadow:0 24px 55px rgba(30,30,35,.12); --shadow-sm:0 14px 34px rgba(30,30,35,.1); color-scheme:light;
}

*{box-sizing:border-box; -webkit-user-select:none; user-select:none;}
html,body{height:100%;}
body{
  margin:0;
  font-family:"SF Pro Display","SF Pro Text","SDSans","Segoe UI Variable Display",
    "Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif;
  font-feature-settings:"ss01" 1,"cv01" 1;
  color:var(--text); background:var(--bg); overflow:hidden;
  transition:background .45s var(--ease),color .35s var(--ease);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
/* статичные монохромные ореолы (без анимации — экономим GPU) */
body::before{
  content:''; position:fixed; inset:-30% -15% auto -15%; height:80vh; z-index:0;
  background:
    radial-gradient(48% 52% at 22% 6%,var(--halo),transparent 60%),
    radial-gradient(42% 48% at 82% 12%,var(--halo),transparent 58%);
  pointer-events:none; opacity:.85;
}

/* верхние стеклянные панели (их немного — можно позволить blur) */
.glass{
  position:relative; background:var(--surface);
  backdrop-filter:blur(16px) saturate(130%); -webkit-backdrop-filter:blur(16px) saturate(130%);
  border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow), inset 0 1px 0 var(--specular);
}
.glass::after{
  content:''; position:absolute; left:16px; right:16px; top:0; height:1px;
  background:linear-gradient(90deg,transparent,var(--sheen),transparent);
  pointer-events:none; opacity:.6;
}

/* ==================== КОМПОНОВКА ==================== */
.app{
  position:relative; z-index:1; height:100vh; padding:16px 22px 20px;
  display:flex; flex-direction:column; gap:12px; max-width:1120px; margin:0 auto;
  opacity:0; transform:translateY(8px);
  transition:opacity .8s var(--ease),transform .8s var(--ease);
}
.app.go{opacity:1; transform:none;}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.rise{opacity:0; animation:rise .85s var(--ease) forwards; animation-play-state:paused;}
.app.go .rise{animation-play-state:running;}
.d1{animation-delay:.05s}.d2{animation-delay:.14s}.d3{animation-delay:.23s}
.d4{animation-delay:.32s}.d5{animation-delay:.41s}

/* ==================== ВЕРХНЯЯ ПАНЕЛЬ ==================== */
.topbar{display:flex; align-items:center; justify-content:space-between; padding:12px 18px;}
.brand{display:flex; align-items:center; gap:12px; font-size:19px; font-weight:750; letter-spacing:-.02em;}
.logo-mark{width:34px; height:34px; flex:none; border-radius:10px;}
.logo-text{display:flex; align-items:center; gap:8px;}
#brandEmoji{font-size:17px; line-height:1; display:inline-block;}
#brandEmoji.pop{animation:emojiPop .8s var(--ease);}
@keyframes emojiPop{0%{transform:scale(.2) rotate(-25deg);opacity:0}60%{transform:scale(1.25) rotate(8deg)}100%{transform:none;opacity:1}}
.top-actions{display:flex; align-items:center; gap:10px;}
.lang-toggle{display:flex; background:var(--field); border:1px solid var(--border);
  border-radius:var(--pill); padding:3px; gap:2px;}
.lang-toggle button{border:0; background:transparent; color:var(--muted); font-weight:650; font-size:12.5px;
  padding:6px 13px; border-radius:var(--pill); cursor:pointer; transition:.3s var(--ease);}
.lang-toggle button.active{background:var(--text); color:var(--bg); box-shadow:0 4px 16px rgba(0,0,0,.22);}
.icon-btn{width:42px; height:42px; display:grid; place-items:center; cursor:pointer;
  background:var(--field); border:1px solid var(--border); border-radius:14px; color:var(--text);
  transition:.3s var(--ease); box-shadow:inset 0 1px 0 var(--specular);}
.icon-btn:hover{transform:translateY(-1px); border-color:var(--border-strong);}
.icon-btn svg{width:19px; height:19px;}

/* ==================== HERO ==================== */
.hero{display:flex; align-items:center; justify-content:space-between; padding:20px 28px; gap:20px;}
.hero-left{display:flex; align-items:center; gap:18px; min-width:0;}
.status-dot{width:15px; height:15px; border-radius:50%; flex:none;
  border:2px solid var(--muted); background:transparent; transition:.4s var(--ease);}
.status-dot.on{background:var(--text); border-color:var(--text);
  box-shadow:0 0 0 4px var(--halo),0 0 22px 2px var(--halo);}
.status-dot.wait{border-color:var(--text); animation:pulse 1.1s ease-in-out infinite;}
@keyframes pulse{50%{opacity:.35}}
.status-title{font-size:26px; font-weight:750; letter-spacing:-.025em; line-height:1.1;}
.status-sub{color:var(--muted); font-size:13.5px; margin-top:4px; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; max-width:38vw;}
.hero-right{display:flex; align-items:center; gap:18px; flex:none;}
.speed{display:flex; flex-direction:column; gap:5px; font-size:13px; font-weight:700;
  font-variant-numeric:tabular-nums; min-width:104px;}
.speed span{display:flex; align-items:center; gap:7px; color:var(--muted); transition:color .3s var(--ease);}
.speed span b{font-weight:700; color:var(--text); font-size:13.5px;}
.speed.live span{color:var(--text);}
.connect-btn{position:relative; overflow:hidden; border:0; cursor:pointer; color:var(--btn-fg);
  font-size:16px; font-weight:700; letter-spacing:.01em; padding:0 34px; height:58px; min-width:186px;
  border-radius:var(--pill); background:var(--btn-bg);
  box-shadow:0 14px 36px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.35);
  transition:.28s var(--ease); flex:none;}
.connect-btn:hover{transform:translateY(-2px); box-shadow:0 20px 46px rgba(0,0,0,.32);}
.connect-btn:active{transform:translateY(0);}
.connect-btn.connecting{background:var(--surface-2); color:var(--text); border:1px solid var(--border);
  animation:pulse 1.1s ease-in-out infinite; pointer-events:none;}
.connect-btn.connected{background:transparent; color:var(--text); border:1px solid var(--border-strong);
  box-shadow:inset 0 1px 0 var(--specular);}

/* ==================== ПЛИТКИ РЕЖИМОВ ==================== */
.modes{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.mode-tile{position:relative; overflow:hidden; display:flex; flex-direction:column; gap:10px;
  padding:15px 17px; border-radius:var(--radius); text-align:left; cursor:pointer;
  background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  box-shadow:inset 0 1px 0 var(--specular); transition:.28s var(--ease); font-family:inherit;}
.mode-tile:hover{transform:translateY(-2px); border-color:var(--border-strong);}
.mode-tile.on{border-color:var(--text); box-shadow:0 0 0 1px var(--text), inset 0 1px 0 var(--specular);}
.mode-tile.locked{opacity:.55;}
.mode-tile.failed .m-sub{color:var(--text); font-weight:650;}
.mode-tile.failed .m-ic{border-color:var(--border-strong);}
.m-top{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.m-ic{width:36px; height:36px; border-radius:11px; display:grid; place-items:center; flex:none;
  background:var(--field); border:1px solid var(--border); box-shadow:inset 0 1px 0 var(--specular);}
.m-ic svg{width:19px; height:19px; fill:none; stroke:var(--text); stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round;}
.m-name{font-size:15px; font-weight:700; letter-spacing:-.01em;}
.m-sub{font-size:12px; color:var(--muted); line-height:1.35;}
/* компактный переключатель внутри плитки */
.sw{width:44px; height:26px; border-radius:var(--pill); flex:none; position:relative;
  background:var(--field); border:1px solid var(--border); transition:.32s var(--ease);}
.sw::after{content:''; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%;
  background:var(--text); transition:.32s var(--ease); box-shadow:0 3px 10px rgba(0,0,0,.35);}
.mode-tile.on .sw{background:var(--text); border-color:var(--text);}
.mode-tile.on .sw::after{transform:translateX(18px); background:var(--bg);}

/* ==================== БАННЕРЫ ==================== */
.banner{display:flex; align-items:center; gap:14px; padding:13px 18px; border-radius:var(--radius-sm);
  border:1px solid var(--border-strong); background:var(--surface-2);}
.banner[hidden]{display:none;}
.banner-ic{flex:none; width:34px; height:34px; display:grid; place-items:center; border-radius:10px;
  background:var(--field); border:1px solid var(--border);}
.banner-ic svg{width:19px; height:19px;}
.banner-tx{flex:1; min-width:0; font-size:13.5px; line-height:1.4;}
.banner-tx b{display:block; font-weight:700;}
.banner-tx span{color:var(--muted);}
.banner-x{flex:none; width:30px; height:30px; border:0; background:transparent; color:var(--muted);
  cursor:pointer; border-radius:9px; font-size:15px; transition:.2s var(--ease);}
.banner-x:hover{background:var(--text); color:var(--bg);}
.banner-btn{flex:none; border:0; cursor:pointer; background:var(--btn-bg); color:var(--btn-fg);
  font-weight:700; font-size:12.5px; padding:9px 16px; border-radius:var(--pill);
  font-family:inherit; transition:.25s var(--ease);}
.banner-btn:hover{transform:translateY(-1px);}

/* ==================== БЫСТРЫЕ ССЫЛКИ ==================== */
.quick-links{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.qlink{position:relative; overflow:hidden; display:flex; align-items:center; gap:14px; cursor:pointer;
  padding:14px 18px; border-radius:var(--radius); text-align:left;
  background:var(--surface-2); border:1px solid var(--border);
  box-shadow:inset 0 1px 0 var(--specular); color:var(--text); transition:.28s var(--ease);}
.qlink:hover{transform:translateY(-2px); border-color:var(--border-strong);}
.q-ic{width:38px; height:38px; border-radius:12px; flex:none; display:grid; place-items:center;
  background:var(--field); border:1px solid var(--border); box-shadow:inset 0 1px 0 var(--specular);}
.q-ic svg{width:19px; height:19px; fill:var(--text);}
.q-tx{display:flex; flex-direction:column; min-width:0; flex:1;}
.q-tx b{font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.q-tx i{font-style:normal; font-size:12.5px; color:var(--muted); margin-top:1px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.q-arrow{color:var(--muted); font-size:18px; flex:none; transition:.3s var(--ease);}
.qlink:hover .q-arrow{transform:translateX(3px); color:var(--text);}

/* ==================== ТАБЫ ==================== */
.tabs{display:flex; align-items:center; gap:5px; padding:7px 8px;}
.tab{position:relative; overflow:hidden; border:0; background:transparent; color:var(--muted);
  font-weight:650; font-size:13.5px; padding:10px 15px; border-radius:14px; cursor:pointer;
  transition:.3s var(--ease); font-family:inherit;}
.tab:hover{color:var(--text);}
.tab.active{background:var(--surface-2); color:var(--text);
  box-shadow:inset 0 0 0 1px var(--border), inset 0 1px 0 var(--specular);}
.tabs .spacer{flex:1;}
.ping-btn{position:relative; overflow:hidden; border:1px solid var(--border); background:var(--field); color:var(--text);
  font-weight:650; font-size:13px; padding:9px 16px; border-radius:var(--pill); cursor:pointer;
  transition:.3s var(--ease); box-shadow:inset 0 1px 0 var(--specular); font-family:inherit;}
.ping-btn:hover{border-color:var(--border-strong); transform:translateY(-1px);}

/* ==================== КОНТЕНТ (жидкий переход) ==================== */
.content{flex:1; min-height:0; position:relative;}
.panel{position:absolute; inset:0; display:none; overflow-y:auto; padding:2px;}
.panel.active{display:block; animation:panelIn .5s var(--ease);}
@keyframes panelIn{
  from{opacity:0; transform:translateY(14px) scale(.99); filter:blur(6px);}
  to{opacity:1; transform:none; filter:blur(0);}
}
.panel::-webkit-scrollbar{width:9px;}
.panel::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
.panel::-webkit-scrollbar-thumb:hover{background:var(--border-strong);}

/* список серверов */
.server-list{display:flex; flex-direction:column; gap:10px;}
.server-card{position:relative; overflow:hidden; display:flex; align-items:center; gap:16px; padding:15px 18px;
  background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm);
  cursor:pointer; transition:.24s var(--ease); box-shadow:inset 0 1px 0 var(--specular);}
.server-card:hover{transform:translateY(-2px); border-color:var(--border-strong);}
.server-card.sel{border-color:var(--text);
  box-shadow:0 0 0 1px var(--text), inset 0 1px 0 var(--specular), var(--shadow-sm);}
.badge{font-size:10.5px; font-weight:800; letter-spacing:.06em; color:var(--text);
  padding:5px 9px; border-radius:9px; min-width:62px; text-align:center; flex:none;
  background:var(--field); border:1px solid var(--border);}
.s-meta{flex:1; min-width:0;}
.s-name{font-weight:650; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.s-addr{color:var(--muted); font-size:12.5px; font-family:ui-monospace,"Cascadia Code",Consolas,monospace;
  margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.ping-chip{font-size:12px; font-weight:700; color:var(--muted); min-width:66px; text-align:right; flex:none;}
.ping-chip.good{color:var(--text)} .ping-chip.mid{color:var(--muted)}
.ping-chip.bad{color:var(--muted); opacity:.7; font-style:italic;}
.del-btn{position:relative; overflow:hidden; width:32px; height:32px; border-radius:10px; border:0; background:transparent;
  color:var(--muted); cursor:pointer; font-size:15px; transition:.2s var(--ease); flex:none;}
.del-btn:hover{background:var(--text); color:var(--bg);}
.empty{color:var(--muted); text-align:center; padding:64px 20px; font-size:15px; line-height:1.7; white-space:pre-line;}

/* карточки-формы */
.card{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius);
  padding:20px 24px; margin-bottom:12px; box-shadow:inset 0 1px 0 var(--specular);}
.card h3{margin:0 0 12px; font-size:15px; font-weight:700; letter-spacing:-.01em;}
.card .hint{margin:0 0 12px; font-size:12.5px; color:var(--muted); line-height:1.5;}
.field, textarea, input[type=text], input[type=number], input[type=password]{
  width:100%; background:var(--field); border:1px solid var(--border); border-radius:14px;
  color:var(--text); font-size:14px; padding:12px 14px; outline:none; transition:.2s var(--ease);
  font-family:inherit; -webkit-user-select:text; user-select:text;}
textarea{min-height:120px; resize:vertical; font-family:ui-monospace,Consolas,monospace; font-size:13px;}
.field:focus, textarea:focus, input:focus{border-color:var(--text); box-shadow:0 0 0 3px var(--halo);}
.field::placeholder,textarea::placeholder{color:var(--muted);}
.btn{position:relative; overflow:hidden; border:0; cursor:pointer; color:var(--btn-fg); font-weight:700; font-size:14px;
  padding:12px 24px; border-radius:var(--pill); background:var(--btn-bg); font-family:inherit;
  box-shadow:0 8px 22px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.3); transition:.26s var(--ease); margin-top:12px;}
.btn:hover{transform:translateY(-2px); box-shadow:0 14px 30px rgba(0,0,0,.28);}
.btn:disabled{opacity:.5; pointer-events:none;}
.btn.ghost{background:var(--field); color:var(--text); border:1px solid var(--border); box-shadow:inset 0 1px 0 var(--specular);}
.btn.ghost:hover{border-color:var(--border-strong);}
.btn-row{display:flex; gap:10px; flex-wrap:wrap;}

/* настройки */
.set-row{display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:13px 0; border-bottom:1px solid var(--border);}
.set-row:last-of-type{border-bottom:0;}
.set-row .lbl{font-size:14px;}
.set-row .lbl i{display:block; font-style:normal; font-size:12px; color:var(--muted); margin-top:2px;}
.set-row .ctl{flex:none; width:210px;} .set-row .ctl.narrow{width:120px;}
.switch{position:relative; width:52px; height:31px; flex:none;}
.switch input{display:none;}
.switch .track{position:absolute; inset:0; background:var(--field); border:1px solid var(--border);
  border-radius:var(--pill); transition:.32s var(--ease); cursor:pointer; box-shadow:inset 0 1px 3px rgba(0,0,0,.15);}
.switch .track::after{content:''; position:absolute; top:3px; left:3px; width:23px; height:23px; border-radius:50%;
  background:var(--text); transition:.32s var(--ease); box-shadow:0 3px 10px rgba(0,0,0,.35);}
.switch input:checked + .track{background:var(--text); border-color:var(--text);}
.switch input:checked + .track::after{transform:translateX(21px); background:var(--bg);}
.xray-status{margin-top:8px; font-size:13px; font-weight:650;}
.xray-ok{color:var(--text);} .xray-no{color:var(--muted);}

/* ==================== МАРШРУТЫ ==================== */
.seg{display:flex; gap:4px; background:var(--field); border:1px solid var(--border);
  border-radius:var(--pill); padding:4px; margin-bottom:6px;}
.seg button{flex:1; border:0; background:transparent; color:var(--muted); font-family:inherit;
  font-weight:650; font-size:13.5px; padding:11px 10px; border-radius:var(--pill); cursor:pointer;
  transition:.3s var(--ease); position:relative; overflow:hidden;}
.seg button.active{background:var(--text); color:var(--bg); box-shadow:0 4px 16px rgba(0,0,0,.22);}
.mode-explain{margin:10px 2px 0!important; font-weight:650; color:var(--text)!important;}
.order-note{margin:12px 0 0!important; padding-top:12px; border-top:1px solid var(--border);}

/* ==================== ПРОФИЛЬ ==================== */
.prof-head{display:flex; align-items:center; gap:18px;}
.prof-avatar{width:64px; height:64px; border-radius:20px; flex:none; overflow:hidden;}
.prof-avatar img{width:100%; height:100%; object-fit:cover; display:block; border-radius:20px;}
.prof-id{flex:1; min-width:0;}
.prof-name{font-size:21px; font-weight:750; letter-spacing:-.02em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.prof-name.mono{font-family:ui-monospace,Consolas,monospace;}
.prof-role{color:var(--muted); font-size:13px; margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.prof-badge{flex:none; font-size:11.5px; font-weight:700; letter-spacing:.03em; padding:7px 13px;

let LANG = "ru";
const t = (k)=> (I18N[LANG][k] ?? k);

function applyLang(lang){
  LANG = (lang==="en") ? "en" : "ru";
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll(".lang-toggle button").forEach(b=>
    b.classList.toggle("active", b.dataset.lang===LANG));
  updateConnectUI(); renderServers(); updateXrayStatus(); renderProfile();
  renderConflicts(); renderModes(); renderRoutes();
}

/* ============================ ТЕМА ============================ */
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const AUTO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></svg>';
let THEME = "auto";
const mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
function systemDark(){ return mq ? mq.matches : true; }
function effectiveDark(){ return THEME==="dark" || (THEME==="auto" && systemDark()); }
function applyTheme(){
  document.body.classList.toggle("theme-dark", THEME==="dark");
  document.body.classList.toggle("theme-light", THEME==="light");
  const btn=document.getElementById("themeBtn");
  btn.innerHTML = THEME==="auto" ? AUTO : (effectiveDark() ? MOON : SUN);
  btn.title = THEME==="auto" ? "Тема: как в системе" : (THEME==="dark" ? "Тёмная тема" : "Светлая тема");
}
if(mq){ mq.addEventListener("change", ()=>{ if(THEME==="auto") applyTheme(); }); }

/* xray_found / tun_found до первого ответа Python — null, а не false:
   иначе первый же рендер (до загрузки состояния) объявляет файлы ненайденными,
   и пользователь видит «tun2socks не найден» на исправной установке. */
let STATE = {servers:[], selected:-1, connected:false, settings:{}, local_id:"",
             rating:0, sub:{}, speed:{}, conflicts:[],
             xray_found:null, tun_found:null, is_admin:null};
let CONFLICTS = [];
let uptimeTimer = null, uptimeStart = 0;
const $ = (id)=>document.getElementById(id);
const api = ()=> (window.pywebview && window.pywebview.api) || null;

/* ---------- форматирование ---------- */
function fmtBytes(n){
  n = Number(n)||0;
  const u=["Б","КБ","МБ","ГБ","ТБ"]; let i=0;
  while(n>=1024 && i<u.length-1){ n/=1024; i++; }
  return (i===0 ? n.toFixed(0) : (n>=100 ? n.toFixed(0) : n.toFixed(n>=10?1:2))) + " " + u[i];
}
function fmtSpeed(n){ return fmtBytes(n) + "/с"; }
function fmtDate(ts){
  try{
    const d=new Date(ts*1000);
    return d.toLocaleDateString(LANG==="en"?"en-GB":"ru-RU",
      {day:"2-digit", month:"2-digit", year:"numeric"});
  }catch(e){ return "—"; }
}
function fmtWhen(ts){
  if(!ts) return "—";
  try{
    const d=new Date(ts*1000);
    return d.toLocaleString(LANG==="en"?"en-GB":"ru-RU",
      {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});
  }catch(e){ return "—"; }
}

async function init(){
  STATE = await api().get_state();
  const s = STATE.settings || {};
  THEME = s.theme || "auto"; applyTheme();
  applyLang(s.lang || "ru");
  fillSettings(); renderServers(); updateConnectUI(); updateXrayStatus();
  renderProfile(); renderModes(); renderRoutes(); renderEmoji(); renderSaveError();
  CONFLICTS = STATE.conflicts || []; renderConflicts();

  // Знакомство показываем один раз: либо оно уже пройдено, либо серверы уже есть.
  if(STATE.intro_done || (STATE.servers && STATE.servers.length)){
    const intro=$("intro"); if(intro) intro.remove();
    document.body.classList.remove("intro-active");
    showApp();
  }else{
    document.body.classList.add("intro-active");
  }

  setInterval(tickEmoji, 60000);
  // лёгкая сверка с Python: туннель мог отвалиться, сторонний VPN — закрыться
  setInterval(async ()=>{
    if(!api() || document.hidden) return;
    try{
      const s = await api().get_state();
      const changed = s.tun_active!==STATE.tun_active || s.connected!==STATE.connected
                   || s.is_admin!==STATE.is_admin || s.tun_found!==STATE.tun_found;
      STATE = s;
      if(changed){ renderModes(); updateConnectUI(); updateXrayStatus(); }
    }catch(e){}
  }, 5000);
}

/* Показать интерфейс. Раньше здесь был requestAnimationFrame — но если окно
   стартует свёрнутым или перекрытым, WebView2 не рисует кадры и колбэк не
   приходит вовсе: приложение остаётся прозрачным и выглядит зависшим.
   Таймер срабатывает всегда, а слушатели ниже — страховка на любой случай. */
function showApp(){
  const root=$("appRoot");
  if(root) setTimeout(()=>root.classList.add("go"), 20);
}
document.addEventListener("visibilitychange", ()=>{
  if(!document.hidden && !document.body.classList.contains("intro-active")) showApp();
});
window.addEventListener("focus", ()=>{
  if(!document.body.classList.contains("intro-active")) showApp();
});

/* ---------- эмодзи возле названия ---------- */
function renderEmoji(){
  const el=$("brandEmoji"); if(!el) return;
  const e=STATE.emoji||"";
  if(el.textContent===e) return;
  el.textContent=e;
  el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
}
async function tickEmoji(){
  try{
    if(!api()) return;
    const r=await api().tick_emoji();
    if(r && r.emoji && r.emoji!==STATE.emoji){ STATE.emoji=r.emoji; renderEmoji(); }
  }catch(e){}
}

/* ---------- сторонние VPN ---------- */
window.__pushConflicts=(list)=>{ CONFLICTS=list||[]; renderConflicts(); };
function renderConflicts(){
  const b=$("conflictBanner"); if(!b) return;
  if(CONFLICTS && CONFLICTS.length){
    $("conflictNames").textContent = " " + CONFLICTS.join(", ");
    b.hidden = false;
  }else{
    b.hidden = true;
  }
}
$("conflictClose").addEventListener("click",()=>{ $("conflictBanner").hidden = true; });

/* ---------- предупреждение о несохранении ---------- */
function renderSaveError(){
  const b=$("saveBanner"); if(!b) return;
  const err=STATE.save_error||"";
  b.hidden = !err;
  if(err) $("saveErrText").textContent = " " + err;
}
$("saveErrBtn").addEventListener("click", ()=>{ if(api()) api().open_data_folder(); });

/* ---------- интро (2 шага) ---------- */
function revealApp(){
  const intro=$("intro");
  if(intro){ intro.classList.add("gone"); setTimeout(()=>intro.remove(),700); }
  document.body.classList.remove("intro-active");
  showApp();

/* ---------- ripple «капля на воде» ---------- */
function spawnRipple(e, el){
  const r=el.getBoundingClientRect();
  const size=Math.max(r.width,r.height)*1.35;
  const x=(e.clientX!=null?e.clientX:r.left+r.width/2)-r.left;
  const y=(e.clientY!=null?e.clientY:r.top+r.height/2)-r.top;
  const rip=document.createElement("span"); rip.className="ripple";
  rip.style.width=rip.style.height=size+"px";
  rip.style.left=(x-size/2)+"px"; rip.style.top=(y-size/2)+"px";
  el.appendChild(rip);
  setTimeout(()=>rip.remove(),880);
}
document.addEventListener("pointerdown",(e)=>{
  const el=e.target.closest("button, .qlink, .server-card, .star");
  if(!el) return;
  const cs=getComputedStyle(el);
  if(cs.position==="static") el.style.position="relative";
  if(cs.overflow==="visible") el.style.overflow="hidden";
  spawnRipple(e, el);
});

function startUptime(){
  uptimeStart=Date.now(); clearInterval(uptimeTimer);
  uptimeTimer=setInterval(()=>{
    if(!STATE.connected){clearInterval(uptimeTimer);return;}
    const s=Math.floor((Date.now()-uptimeStart)/1000);
    const hh=String(Math.floor(s/3600)).padStart(2,"0");
    const mm=String(Math.floor(s%3600/60)).padStart(2,"0");
    const ss=String(s%60).padStart(2,"0");
    const sv=STATE.servers[STATE.selected];
    $("statusSub").textContent=(sv?sv.name:"")+"   ·   "+hh+":"+mm+":"+ss;
  },1000);
}

  b.addEventListener("click", async ()=>{
    applyLang(b.dataset.lang);
    if(api()) STATE=await api().save_settings({lang:b.dataset.lang});
  }));

/* ---------- тост ---------- */
let toastTimer=null;
window._baseToast=function(msg,isErr){
  const el=$("toast"); el.textContent=msg;
  el.className="toast show"+(isErr?" err":"");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{el.className="toast"+(isErr?" err":"");},3200);
};
function toast(msg,isErr){
  window._baseToast(msg,isErr);
  if(isErr && !STATE.tutorial_done && STATE.intro_done && msg!==t("err_tutorial_hint")){
    setTimeout(()=>window._baseToast(t("err_tutorial_hint"),true),3500);
  }
}

/* ---------- старт ---------- */
applyTheme(); applyLang("ru");

/* ============================ ТУТОРИАЛ ============================ */
const TUTORIAL_STEPS=[
  {target:".server-list",title:"tutorial_step1",desc:"tutorial_step1_d"},
  {target:"#connectBtn",title:"tutorial_step2",desc:"tutorial_step2_d"},
  {target:".modes",title:"tutorial_step3",desc:"tutorial_step3_d"},
  {target:"#panel-routes",tab:"routes",title:"tutorial_step4",desc:"tutorial_step4_d"},
  {target:"#panel-settings",tab:"settings",title:"tutorial_step5",desc:"tutorial_step5_d"},
  {target:"#panel-logs",tab:"logs",title:"tutorial_step6",desc:"tutorial_step6_d"}
];
let _tutStep=0, _tutPrevTab="servers";
function startTutorial(){
  _tutStep=0; _tutPrevTab="servers";
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab==="servers"));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id==="panel-servers"));
  $("tutorialOverlay").classList.add("active");
  renderTutorialStep();
}
function renderTutorialStep(){
  const steps=TUTORIAL_STEPS, el=$("tutorialOverlay");
  if(_tutStep>=steps.length){
    el.classList.remove("active");
    document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab==="servers"));
    document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id==="panel-servers"));
    if(api()) api().finish_tutorial().then(r=>{ STATE.tutorial_done=true; });
    return;
  }
  const s=steps[_tutStep];
  const prog=$("tutorialProgress");
  prog.innerHTML=steps.map((_,i)=>`<span class="${i<_tutStep?'done':''}"></span>`).join("");
  $("tutorialTitle").textContent=t(s.title);
  $("tutorialDesc").textContent=t(s.desc);
  $("tutorialNextBtn").textContent=_tutStep<steps.length-1?t("tutorial_next"):"✓";
  if(s.tab){
    document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===s.tab));
    document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id==="panel-"+s.tab));
  }
  requestAnimationFrame(()=>{
    const tgt=document.querySelector(s.target);
    const hl=$("tutorialHighlight"), tt=$("tutorialTooltip");
    if(tgt){
      const r=tgt.getBoundingClientRect();
      hl.style.display="block";
      hl.style.left=Math.max(0,r.left-6)+"px"; hl.style.top=Math.max(0,r.top-6)+"px";
      hl.style.width=Math.min(r.width+12,window.innerWidth)+"px";
      hl.style.height=Math.min(r.height+12,window.innerHeight)+"px";
      let ttTop=r.bottom+16;
      if(ttTop+200>window.innerHeight) ttTop=Math.max(10,r.top-220);
      tt.style.top=ttTop+"px";
      tt.style.left=Math.max(10,Math.min(r.left,window.innerWidth-400))+"px";
    }
  });
}
$("tutorialNextBtn").addEventListener("click",()=>{ _tutStep++; renderTutorialStep(); });
$("tutorialSkipBtn").addEventListener("click",async()=>{
  $("tutorialOverlay").classList.remove("active");
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab==="servers"));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id==="panel-servers"));
  if(api()) try{ await api().finish_tutorial(); STATE.tutorial_done=true; }catch(e){}
});
$("repeatTutorialBtn").addEventListener("click", async ()=>{
  if(api()) await api().reset_tutorial();
  startTutorial();
});

/* ============================ НОВОСТИ ============================ */
let _newsDisabled=false, _newsPostId="";
async function checkNews(){
  if(!api()) return;
  try{
    const r=await api().get_news();
    if(!r||!r.ok) return;
    _newsDisabled=!!r.disabled;
    $("newsOffToggle").checked=_newsDisabled;
    if(!r.html){
      $("newsFeed").innerHTML=`<div class="news-empty">${t("news_no_posts")}</div>`;
      return;
    }
    renderNews(r.html, r.date, r.post_id);
    if(r.post_id && r.post_id!==_newsPostId && _newsPostId){
      const tab=document.querySelector('.tab[data-tab="news"]');
      if(tab && !tab.classList.contains("active")){
        if(!tab.querySelector(".news-pulse")){
          const p=document.createElement("span");p.className="news-pulse";tab.appendChild(p);
        }
      }
    }
    _newsPostId=r.post_id||"";
    if(api()) STATE=await api().save_settings({last_news_id:_newsPostId||""});
  }catch(e){}
}
function renderNews(html, date, postId){
  let dateStr="";
  if(date){
    try{const d=new Date(date);dateStr=d.toLocaleDateString(LANG==="en"?"en-GB":"ru-RU",{day:"2-digit",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"});}catch(e){dateStr=date;}
  }
  $("newsFeed").innerHTML=`<div class="news-post"><div class="news-post-body">${html}</div>${dateStr?`<div class="news-date">${dateStr}</div>`:''}</div>`;
}
$("newsOffToggle").addEventListener("change", async ()=>{
  _newsDisabled=$("newsOffToggle").checked;
  if(api()) STATE=await api().save_settings({news_off:_newsDisabled});
});

/* ============================ КАСТОМНЫЙ ФОН ============================ */
async function loadBg(){
  if(!api()) return;
  try{
    const r=await api().get_background();
    if(r&&r.data){
      document.body.style.setProperty("--bg-img","url(data:image/png;base64,"+r.data+")");
      document.body.classList.add("has-bg");
      if($("bgRemoveBtn")) $("bgRemoveBtn").style.display="";
      enforceThemeForBg();
    }
  }catch(e){}
}
$("bgUploadInput").addEventListener("change", async (e)=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async ()=>{
    const b64=reader.result.split(",")[1];
    if(api()){
      const r=await api().upload_background(b64);
      if(r&&r.ok){
        document.body.style.setProperty("--bg-img","url(data:image/png;base64,"+b64+")");
        document.body.classList.add("has-bg");
        STATE=r.state||STATE;
        if($("bgRemoveBtn")) $("bgRemoveBtn").style.display="";
        enforceThemeForBg();
      }
    }
  };
  reader.readAsDataURL(file);
});
$("bgRemoveBtn").addEventListener("click", async ()=>{
  if(api()){
    const r=await api().remove_background();
    STATE=r.state||STATE;
  }
  document.body.style.removeProperty("--bg-img");
  document.body.classList.remove("has-bg");
  if($("bgRemoveBtn")) $("bgRemoveBtn").style.display="none";
});

/* ==================== ТЕМА + ФОН: блокировка ==================== */
function enforceThemeForBg(){
  if(document.body.classList.contains("has-bg")){
    if(THEME!=="dark"){
      THEME="dark"; applyTheme();
      if(api()) api().save_settings({theme:THEME});
    }
  }
}

/* ============================ КАСТОМНЫЕ ЦВЕТА ============================ */
let CUSTOM_COLORS_ACTIVE=false;
function loadColorPickers(){
  const s=STATE.settings||{};
  if(s.custom_bg) $("colorBg").value=s.custom_bg;
  if(s.custom_text) $("colorText").value=s.custom_text;
  if(s.custom_accent) $("colorAccent").value=s.custom_accent;
  if(s.custom_surface) $("colorSurface").value=s.custom_surface;
  CUSTOM_COLORS_ACTIVE=!!(s.custom_bg||s.custom_text||s.custom_accent||s.custom_surface);
  if(CUSTOM_COLORS_ACTIVE) applyCustomColors();
}
function applyCustomColors(){
  const root=document.documentElement;
  const c=STATE.settings||{};
  const hasCustom=!!(c.custom_bg||c.custom_text||c.custom_accent||c.custom_surface);
  if(!hasCustom){
    resetCustomColors();
    return;
  }
  const bg=$("colorBg").value, txt=$("colorText").value, acc=$("colorAccent").value, surf=$("colorSurface").value;
  if(bg) root.style.setProperty("--bg",bg);
  if(txt){root.style.setProperty("--text",txt);root.style.setProperty("--btn-fg",bg||"var(--btn-fg)");}
  if(acc) root.style.setProperty("--btn-bg",acc);
  if(surf) root.style.setProperty("--surface-2",surf);
  CUSTOM_COLORS_ACTIVE=true;
}
function resetCustomColors(){
  const root=document.documentElement;
  ["--bg","--text","--btn-fg","--btn-bg","--surface-2"].forEach(p=>root.style.removeProperty(p));
  CUSTOM_COLORS_ACTIVE=false;
}
$("applyColorsBtn").addEventListener("click", async ()=>{
  applyCustomColors();
  if(api()){
    STATE=await api().save_settings({
      custom_bg:$("colorBg").value, custom_text:$("colorText").value,
      custom_accent:$("colorAccent").value, custom_surface:$("colorSurface").value
    });
  }
  toast(t("saved"));
});

/* ============================ КАСТОМНЫЙ ШРИФТ ============================ */
async function loadFont(){
  if(!api()) return;
  try{
    const s=STATE.settings||{};
    if(!s.has_custom_font) return;
    const r=await api().get_font();
    if(r&&r.data){
      injectFont(r.data);
      if($("fontRemoveBtn")) $("fontRemoveBtn").style.display="";
      if($("fontApplyBtn")) $("fontApplyBtn").style.display="";
      if($("fontPreview")) $("fontPreview").hidden=false;
    }
  }catch(e){}
}
function injectFont(b64){
  let el=document.getElementById("customFontStyle");
  if(!el){el=document.createElement("style");el.id="customFontStyle";document.head.appendChild(el);}
  el.textContent=`@font-face{font-family:'CustomUserFont';src:url(data:font/ttf;base64,${b64}) format('truetype');font-display:swap;} body, body *{font-family:'CustomUserFont',"SF Pro Display","SF Pro Text","Segoe UI",system-ui,sans-serif!important;}`;
}
$("fontUploadInput").addEventListener("change", async (e)=>{
  const file=e.target.files[0]; if(!file) return;
  if(file.size>20*1024*1024){toast("Max 20 MB",true);return;}
  const reader=new FileReader();
  reader.onload=async ()=>{
    const b64=reader.result.split(",")[1];
    if(api()){
      const r=await api().upload_font(b64);
      if(r&&r.ok){
        injectFont(b64);
        STATE=r.state||STATE;
        if($("fontRemoveBtn")) $("fontRemoveBtn").style.display="";
        if($("fontApplyBtn")) $("fontApplyBtn").style.display="";
        if($("fontPreview")) $("fontPreview").hidden=false;
      }
    }
  };
  reader.readAsDataURL(file);
});
$("fontRemoveBtn").addEventListener("click", async ()=>{
  if(api()){const r=await api().remove_font();STATE=r.state||STATE;}
  const el=document.getElementById("customFontStyle");if(el)el.remove();
  if($("fontRemoveBtn")) $("fontRemoveBtn").style.display="none";
  if($("fontApplyBtn")) $("fontApplyBtn").style.display="none";
  if($("fontPreview")) $("fontPreview").hidden=true;
});
$("fontApplyBtn").addEventListener("click", async ()=>{
  if(!api()) return;
  try{
    const r=await api().get_font();
    if(r&&r.data) injectFont(r.data);
  }catch(e){}
  toast(t("saved"));
});

/* ============================ ИНФО О СБОРКЕ ============================ */
async function loadBuildInfo(){
  if(!api()) return;
  try{
    const r=await api().get_build_info();
    if(!r) return;
    $("buildInfo").textContent=r.version+" · "+r.date;
    $("sysinfoVersion").textContent=r.version;
    $("sysinfoDate").textContent=r.date;
    $("sysinfoPython").textContent=r.python;
    $("sysinfoPlatform").textContent=r.platform;
  }catch(e){}
}

/* ============================ INIT ============================ */
async function initEnhanced(){
  if(api()) STATE = await api().get_state();
  const s = STATE.settings || {};
  THEME = s.theme || "auto"; applyTheme();
  applyLang(s.lang || "ru");
  fillSettings(); renderServers(); updateConnectUI(); updateXrayStatus();
  renderProfile(); renderModes(); renderRoutes(); renderEmoji(); renderSaveError();
  CONFLICTS = STATE.conflicts || []; renderConflicts();

  if(STATE.intro_done || (STATE.servers && STATE.servers.length)){
    const intro=$("intro"); if(intro) intro.remove();
    document.body.classList.remove("intro-active");
    showApp();
  }else{
    document.body.classList.add("intro-active");
  }

  setInterval(tickEmoji, 60000);
  setInterval(async ()=>{
    if(!api() || document.hidden) return;
    try{
      const s = await api().get_state();
      const changed = s.tun_active!==STATE.tun_active || s.connected!==STATE.connected
                   || s.is_admin!==STATE.is_admin || s.tun_found!==STATE.tun_found;
      STATE = s;
      if(changed){ renderModes(); updateConnectUI(); updateXrayStatus(); }
    }catch(e){}
  }, 5000);

  // v2.1.0 additions — обёрнуты в try/catch, чтобы не ломали интро
  try{ await loadBg(); }catch(e){}
  try{ await loadFont(); }catch(e){}
  try{ loadColorPickers(); }catch(e){}
  try{ await loadBuildInfo(); }catch(e){}
  try{
    if(s.background_image==="custom"){
      document.body.classList.add("has-bg");
      if($("bgRemoveBtn")) $("bgRemoveBtn").style.display="";
      enforceThemeForBg();
    }
  }catch(e){}
  if(!STATE.tutorial_done && STATE.intro_done && !(STATE.sub && STATE.sub.url)){
    setTimeout(()=>startTutorial(),600);
  }
  try{ checkNews(); }catch(e){}
}
if(window.pywebview && window.pywebview.api){ initEnhanced(); }
else window.addEventListener("pywebviewready", initEnhanced);
</script>
